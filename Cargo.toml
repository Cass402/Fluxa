[workspace]
members = [
    "programs/fluxa_core",
]
exclude = [
    "programs/fluxa_core/fuzz",
]
resolver = "3"

[profile.test]
overflow-checks = false
lto = "fat"
codegen-units = 1
opt-level = 3
incremental = false
panic = "abort"
strip = "symbols"
debug = false

[profile.release]
overflow-checks = false
lto = "fat"
codegen-units = 1
opt-level = 3
incremental = false
panic = "abort"
strip = "symbols"
debug = false

[profile.release.package."*"]
overflow-checks = false
codegen-units = 1
opt-level = 3
incremental = false
strip = "symbols"
debug = false

[profile.release.build-override]
opt-level = 'z'
incremental = false
codegen-units = 1
strip = "symbols"
debug = false