[package]
name = "fluxa_core-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ethnum = "1.5"

[dependencies.fluxa_core]
path = ".."

[[bin]]
name = "fuzz_target_1"
