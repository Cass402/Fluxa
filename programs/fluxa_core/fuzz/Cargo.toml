doc = false
bench = false

[[bin]]
name = "sqrt_fuzz"
path = "fuzz_targets/sqrt_fuzz.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tick_conversion_fuzz"
path = "fuzz_targets/tick_conversion_fuzz.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mul_div_fuzz"
path = "fuzz_targets/mul_div_fuzz.rs"
test = false
doc = false
bench = false

[[bin]]
name = "crash_safety_fuzz"
path = "fuzz_targets/crash_safety_fuzz.rs"
test = false
doc = false
bench = false
